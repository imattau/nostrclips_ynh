location / {
  root __INSTALL_DIR__/www;
  index index.html;

  # ffmpeg-core.wasm (client-side video trim/encode) needs the correct MIME
  # type for the browser to compile it; Debian's stock nginx mime.types
  # doesn't map it.
  location ~* \.wasm$ {
    default_type application/wasm;
  }

  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  # Content-addressed build assets (e.g. /assets/index-XXXXXXXX.js) never
  # change contents under a given filename, so they can be cached forever.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # ffmpeg-core.js/.wasm keep fixed filenames across builds (they are copied
  # as-is from node_modules, not content-hashed by Vite), so - like the
  # service worker below - they must never be cached by the browser or a
  # client can get stuck on a stale copy after a YunoHost upgrade.
  location ^~ /ffmpeg-core/ {
    add_header Cache-Control "no-cache" always;
  }

  # The service worker and its Workbox runtime are re-generated on every
  # build but keep the *same* filenames, so they must never be cached by the
  # browser either.
  location ~* ^/(sw\.js|workbox-[^/]+\.js)$ {
    add_header Cache-Control "no-cache" always;
  }

  # Single-page app: unknown paths (client-side routes, deep links, reloads)
  # fall back to index.html.
  try_files $uri $uri/ /index.html;

  more_set_headers "X-Content-Type-Options: nosniff";
}
