#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "nostrclips"
name = "Nostr Clips"
description.en = "Consumption-first, TikTok-style vertical short-form video client for Nostr"
description.fr = "Client Nostr de vidéos courtes verticales, façon TikTok, orienté consultation"

version = "0.3.3~ynh1"

maintainers = []

[upstream]
license = "free"
website = "https://github.com/imattau/scrollstr"
code = "https://github.com/imattau/scrollstr"

[integration]
yunohost = ">= 12.1"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "300M"
ram.build = "1G"
ram.runtime = "20M"

[install]
    [install.domain]
    type = "domain"

    # No `install.path` question: the app's PWA manifest/service-worker scope
    # and its hardcoded absolute "/..." asset paths assume it is served from
    # the domain root. A sub-path install would need upstream changes.

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    help.en = "Who should be allowed to access Nostr Clips? Nostr login (browser extension, nsec, or passkey) happens inside the app itself and is independent of this permission."
    help.fr = "Qui doit pouvoir accéder à Nostr Clips ? La connexion Nostr (extension navigateur, nsec, ou passkey) se fait dans l'application elle-même, indépendamment de cette permission."

[resources]
    [resources.sources.main]
    url = "https://github.com/imattau/scrollstr/archive/bc3c6ab78a11e7597f4391ec5d8693c377d5f10d.tar.gz"
    sha256 = "ceb68945ad417f078eb78067dc72b4c18436be9e1b99354b9a0294268882b36f"
    autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    # Needed only to build the static frontend; nothing Node-related runs at
    # request time - nginx serves the prebuilt ./dist directory directly.
    [resources.nodejs]
    version = "22"
